name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake git \
            libasound2-dev libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev libgl1-mesa-dev \
            libglu1-mesa-dev

      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Package client
        run: |
          mkdir -p demo/dist/ctf-client-linux
          cp build/ctf_client demo/dist/ctf-client-linux/
          cp build/ctf_bot demo/dist/ctf-client-linux/

          cat > demo/dist/ctf-client-linux/join.sh << 'JOINSCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          SERVER_IP="${1:-}"
          if [ -z "$SERVER_IP" ]; then
              echo "Usage: ./join.sh <server-ip>"
              echo "Example: ./join.sh 192.168.1.105"
              exit 1
          fi
          NAME="${2:-player$(shuf -i 1-999 -n 1)}"
          echo "Joining $SERVER_IP:7777 as '$NAME'..."
          ./ctf_client --host "$SERVER_IP" --port 7777 --name "$NAME"
          JOINSCRIPT
          chmod +x demo/dist/ctf-client-linux/join.sh

          cat > demo/dist/ctf-client-linux/README.txt << 'READMEFILE'
          CTF Client - Quick Start
          ========================
          1. Connect to the host's WiFi hotspot
          2. Run: ./join.sh <server-ip>
          Controls: WASD=move, Mouse=aim, LeftClick=shoot, ENTER=start(host)
          READMEFILE

          cd demo/dist
          tar czf ctf-client-linux.tar.gz ctf-client-linux/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: demo/dist/ctf-client-linux.tar.gz
          generate_release_notes: true
